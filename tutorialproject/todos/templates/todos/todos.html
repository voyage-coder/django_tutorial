{% extends 'todos/base.html' %}

{% block title %}Todos{% endblock %}

{% block content %}

<ul>
{% for todo in todos %}
    <li><b>{{todo.id}} - {{todo.title}}:</b>{Done: {{todo.done}}}</li>
{% endfor %}
</ul>

<form method="post">
    <!-- no action endpoint needed bcz we are posting to same endpoint to ourselves-->
    {% csrf_token %}
    {{ from.as_p}}
    <button type ="submit">Save</button>
</form>

{% endblock %}
